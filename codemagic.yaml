workflows:
  android-preview:
    name: Android Preview Build
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      groups:
        - expo_credentials
        - app_secrets
      vars:
        EXPO_TOKEN: $EXPO_TOKEN
        # All EXPO_PUBLIC_* vars loaded from app_secrets group
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Install EAS CLI
        script: npm install -g eas-cli
      - name: Configure Git
        script: |
          git config --global user.email "build@codemagic.io"
          git config --global user.name "Codemagic Build"
      - name: Decode google-services.json
        script: echo $GOOGLE_SERVICES_JSON | base64 -d > android/app/google-services.json
      - name: Create .env file
        script: |
          cat > .env.local << EOF
          EXPO_PUBLIC_TMDB_API_KEY="$EXPO_PUBLIC_TMDB_API_KEY"
          EXPO_PUBLIC_FIREBASE_API_KEY="$EXPO_PUBLIC_FIREBASE_API_KEY"
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN="$EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN"
          EXPO_PUBLIC_FIREBASE_PROJECT_ID="$EXPO_PUBLIC_FIREBASE_PROJECT_ID"
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET="$EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET"
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID="$EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID"
          EXPO_PUBLIC_FIREBASE_APP_ID="$EXPO_PUBLIC_FIREBASE_APP_ID"
          EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID="$EXPO_PUBLIC_FIREBASE_MEASUREMENT_ID"
          EXPO_PUBLIC_SUPABASE_URL="$EXPO_PUBLIC_SUPABASE_URL"
          EXPO_PUBLIC_APP_UPDATE_FEED_URL="$EXPO_PUBLIC_APP_UPDATE_FEED_URL"
          EXPO_PUBLIC_SUPABASE_ANON_KEY="$EXPO_PUBLIC_SUPABASE_ANON_KEY"
          EXPO_PUBLIC_PAYBILL_ADMIN_EMAIL="$EXPO_PUBLIC_PAYBILL_ADMIN_EMAIL"
          EXPO_PUBLIC_YOUTUBE_INNERTUBE_KEY="$EXPO_PUBLIC_YOUTUBE_INNERTUBE_KEY"
          EOF
      - name: Build Android Preview
        script: eas build --platform android --profile preview --non-interactive --no-wait
    artifacts:
      - build-*.apk
      - build-*.aab

  android-production:
    name: Android Production Build
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 20
      groups:
        - expo_credentials
        - play_store_credentials
